<text x="160" y="470" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#202124" text-anchor="start" font-weight="700" xml:space="preserve">Units are 2 MiB, a layer&#x27;s state is 3.06 MiB, so the borders don&#x27;t line up. They don&#x27;t need to:</text>
<text x="160" y="496" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#202124" text-anchor="start" font-weight="400" xml:space="preserve">the GPU finds byte x of the array in unit  state[x / 2 MiB],  at offset  x % 2 MiB.</text>
<text x="160" y="522" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#5F6368" text-anchor="start" font-weight="400" xml:space="preserve">Layer 1 starts at 3.06 MiB → s1 (unit 13), 1.06 MiB in. Layer 0 runs from s0 into s1.</text>
<text x="160" y="548" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#5F6368" text-anchor="start" font-weight="400" xml:space="preserve">Layers 3, 7, 11, … 63 are missing: they are full attention, and keep K/V pages instead.</text>
<text x="160" y="574" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#5F6368" text-anchor="start" font-weight="400" xml:space="preserve">48 layers × 3.06 MiB = 146.8 MiB → 74 units of 2 MiB = 148 MiB: the last 1.2 MiB is unused.</text></svg>
