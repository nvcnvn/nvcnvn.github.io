<text x="706" y="546" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#202124" text-anchor="start" font-weight="400" xml:space="preserve">74 units, for the request&#x27;s whole life.</text>
<text x="24" y="610" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#5F6368" text-anchor="start" font-weight="400" xml:space="preserve">The bitmap, the refcounts and alloc() never look inside a unit. Only the attention kernels do, and they learn what a unit is from the table.</text></svg>
