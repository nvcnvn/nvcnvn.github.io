<text x="1185.0" y="352" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" fill="#5F6368" text-anchor="middle" font-weight="400" xml:space="preserve">K/V, state</text>
<rect x="24" y="410" width="1232" height="74" rx="8" fill="#FAFAFA" stroke="#DADCE0" stroke-width="1"/>
<text x="40" y="436" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#202124" text-anchor="start" font-weight="700" xml:space="preserve">× 2 sets: two chunks in flight</text>
<text x="40" y="458" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#5F6368" text-anchor="start" font-weight="400" xml:space="preserve">The ANE runs chunk k&#x27;s dense(i) from set k while the GPU fills set k+1 and runs the other chunk&#x27;s attention.</text>
<text x="40" y="476" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#5F6368" text-anchor="start" font-weight="400" xml:space="preserve">Each set is rewritten only after the ANE call that read it has returned: the same &quot;don&#x27;t overwrite what someone is reading&quot; rule as the arena.</text>
<text x="24" y="516" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#202124" text-anchor="start" font-weight="700" xml:space="preserve">27B, measured (mllm bench, M4 Pro)</text>
<text x="24" y="544" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#5F6368" text-anchor="start" font-weight="700" xml:space="preserve"></text>
<text x="470" y="544" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#5F6368" text-anchor="start" font-weight="700" xml:space="preserve">GPU prefill</text>
<text x="700" y="544" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#5F6368" text-anchor="start" font-weight="700" xml:space="preserve">ANE, one copy</text>
<text x="930" y="544" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#5F6368" text-anchor="start" font-weight="700" xml:space="preserve"></text>
<line x1="24" y1="552" x2="1256" y2="552" stroke="#DADCE0" stroke-width="1"/>
<text x="24" y="570" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#202124" text-anchor="start" font-weight="400" xml:space="preserve">prompt of 4,096 tokens</text>
<text x="470" y="570" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="14" fill="#202124" text-anchor="start" font-weight="400" xml:space="preserve">131 tok/s</text>
<text x="700" y="570" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="14" fill="#202124" text-anchor="start" font-weight="700" xml:space="preserve">191 tok/s</text>
<text x="930" y="570" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#5F6368" text-anchor="start" font-weight="400" xml:space="preserve">chunks overlap: ANE dense, GPU attn</text>
<line x1="24" y1="578" x2="1256" y2="578" stroke="#DADCE0" stroke-width="1"/>
<text x="24" y="596" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#202124" text-anchor="start" font-weight="400" xml:space="preserve">decode while a 2,048-token prefill runs</text>
<text x="470" y="596" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="14" fill="#202124" text-anchor="start" font-weight="400" xml:space="preserve">3.3 tok/s</text>
<text x="700" y="596" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="14" fill="#202124" text-anchor="start" font-weight="700" xml:space="preserve">12.1 tok/s</text>
<text x="930" y="596" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#5F6368" text-anchor="start" font-weight="400" xml:space="preserve">decode alone: 15.0–15.3</text>
<line x1="24" y1="604" x2="1256" y2="604" stroke="#DADCE0" stroke-width="1"/>
<text x="24" y="622" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#202124" text-anchor="start" font-weight="400" xml:space="preserve">peak memory</text>
<text x="470" y="622" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="14" fill="#202124" text-anchor="start" font-weight="400" xml:space="preserve">16.7 GB</text>
<text x="700" y="622" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="14" fill="#202124" text-anchor="start" font-weight="700" xml:space="preserve">19.8 GB</text>
<text x="930" y="622" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#5F6368" text-anchor="start" font-weight="400" xml:space="preserve">a second baked copy would add ~15 GB</text></svg>
